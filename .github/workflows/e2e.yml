name: E2E
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.ts"
      - "**.tsx"
      - "**/tsconfig.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "**.ts"
      - "**.tsx"
      - "**/tsconfig.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

defaults:
  run:
    shell: "bash"

permissions:
  contents: read

jobs:
  test_e2e:
    runs-on: ubuntu-latest
    name: Playwright tests
    timeout-minutes: 20

    services:
      mysql:
        image: mariadb:10.11@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bigcapital_system
          MYSQL_USER: bigcapital
          MYSQL_PASSWORD: bigcapital
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.23.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build shared packages
        run: pnpm build

      - name: Create server .env file
        run: |
          cat > packages/server/.env << EOF
          # Database
          DB_HOST=127.0.0.1
          DB_USER=bigcapital
          DB_PASSWORD=bigcapital
          DB_ROOT_PASSWORD=root
          DB_CHARSET=utf8

          # System database
          SYSTEM_DB_NAME=bigcapital_system

          # Tenant databases
          TENANT_DB_NAME_PERFIX=bigcapital_tenant_

          # Application
          BASE_URL=http://localhost:3000
          APP_JWT_SECRET=test-app-jwt-secret-for-e2e-testing-32-characters

          # Sign-up
          SIGNUP_DISABLED=false

          # API throttling
          THROTTLE_GLOBAL_TTL=60000
          THROTTLE_GLOBAL_LIMIT=300
          THROTTLE_AUTH_TTL=60000
          THROTTLE_AUTH_LIMIT=30

          # Redis
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379

          # S3 (placeholder values for E2E tests)
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=test-access-key
          S3_SECRET_ACCESS_KEY=test-secret-key
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=test-bucket

          # Mail (placeholder values for E2E tests)
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_FROM_NAME=Bigcapital
          MAIL_FROM_ADDRESS=test@bigcapital.app
          EOF

      - name: Grant tenant database privileges
        run: |
          CID=$(docker ps -qf "ancestor=mariadb:10.6" | head -1)
          docker exec "$CID" mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON \`bigcapital_system\`.* TO 'bigcapital'@'%'; GRANT ALL PRIVILEGES ON \`bigcapital\\_tenant\\_%\`.* TO 'bigcapital'@'%'; FLUSH PRIVILEGES;"

      - name: Run database migrations
        run: pnpm system:migrate:latest

      - name: Start server in background
        run: |
          cd packages/server && pnpm start:prod &
          sleep 10
        env:
          NODE_ENV: production

      - name: Start webapp in background
        run: |
          cd packages/webapp && VITE_REACT_QUERY_DEVTOOLS=false pnpm dev &
          sleep 10

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        run: pnpm run e2e:webapp
        env:
          PLAYWRIGHT_TEST_API_URL: http://localhost:3000
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4000

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
