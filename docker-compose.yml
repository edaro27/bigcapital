name: bigcapital-dev-infrastructure

services:
  mariadb:
    build:
      context: ./docker/mariadb
    environment:
      MYSQL_DATABASE: ${SYSTEM_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TENANT_DB_NAME_PERFIX: ${TENANT_DB_NAME_PERFIX}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mariadb-admin ping --silent --host=localhost --user=root --password="$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    build:
      context: ./docker/redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:1025:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:8025:8025"
    volumes:
      - mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  mysql:
    name: bigcapital_dev_mysql
  redis:
    name: bigcapital_dev_redis
  mailpit:
    name: bigcapital_dev_mailpit
